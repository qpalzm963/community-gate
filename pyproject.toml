[project]
name = "community-gate"
version = "0.1.0"
description = "社區出入管理系統（車牌辨識 + 訪客管理）單機版"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "fast-alpr[onnx]>=0.3",
    "pwdlib[argon2]>=0.2",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
modbus = ["pymodbus>=3.6"]

[project.scripts]
gate = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
artifacts = ["backend/app/static/**"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
