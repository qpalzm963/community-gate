stages:
  - deploy

# aiBorn 自動部署：打包已提交的程式、上傳並等部署完成（失敗時 job 會變紅）
# 需要 GitLab CI/CD 變數 AIBORN_DEPLOY_TOKEN（Masked + Protected）
deploy_aiborn:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache curl git
    - git archive --format=zip -o src.zip HEAD
    - >
      curl -sS -N --fail-with-body -X POST "https://aiborn.program.com.tw/api/ci/v1/deploy"
      -H "Authorization: Bearer $AIBORN_DEPLOY_TOKEN"
      -F "file=@src.zip"
      --form-string "note=$CI_COMMIT_TITLE"
      --form-string "commit=$CI_COMMIT_SHA"
      --form-string "pipelineUrl=$CI_PIPELINE_URL"
      | tee aiborn-deploy.log
    - grep -q "AIBORN_STATUS=success" aiborn-deploy.log
